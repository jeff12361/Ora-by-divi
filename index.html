<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ora by Divi — Soft Girl Jewelry, Affordable Luxury</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F8E9E7;
    --blush-dim:#F0D7D4;
    --ink:#2E211F;
    --rose:#B5546F;
    --gold:#C9A063;
    --line:#E9D2CE;
    --stone:#8C7873;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--blush);color:var(--ink);
    font-family:'Quicksand', sans-serif;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .serif{font-family:'Playfair Display', serif;}
  img{max-width:100%;display:block;}
  button{font-family:'Quicksand',sans-serif;}

  /* ---------- NAV ---------- */
  nav{
    max-width:1180px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 24px 0;position:relative;
  }
  .badge{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--rose);color:#fff;padding:5px 14px;border-radius:20px;
    margin-bottom:14px;opacity:0;animation:fadeIn .7s ease-out forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}
  .wordmark{
    font-family:'Playfair Display', serif;font-weight:700;
    font-size:clamp(30px,5vw,46px);letter-spacing:.02em;
  }
  .tagline{font-size:13px;letter-spacing:.06em;color:var(--stone);margin-top:6px;text-align:center;}
  .nav-row{
    display:flex;align-items:center;justify-content:center;gap:20px;
    margin:22px 0 18px;width:100%;position:relative;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;
  }
  .navlinks{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;}
  .navlink{font-size:14px;font-weight:600;cursor:pointer;padding-bottom:3px;border-bottom:1px solid transparent;}
  .navlink.active,.navlink:hover{border-bottom-color:var(--rose);color:var(--rose);}
  .cart-btn{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;
    padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;
  }
  .cart-btn:hover{background:var(--rose);}
  .cart-count{background:#fff;color:var(--ink);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .hamburger{display:none;position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;}
  .hamburger span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;}

  main{max-width:1180px;margin:0 auto;padding:34px 24px 70px;min-height:60vh;}

  /* ---------- HERO ---------- */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding:10px 0 54px;}
  .hero-img{border-radius:8px;overflow:hidden;background:var(--blush-dim);aspect-ratio:4/5;}
  .hero-img img{width:100%;height:100%;object-fit:cover;}
  .hero-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700;margin-bottom:12px;display:block;}
  .hero h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(30px,4vw,44px);line-height:1.12;margin:0 0 16px;}
  .hero p{font-size:16px;line-height:1.6;color:#4a3a37;max-width:44ch;margin:0 0 26px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--rose);color:#fff;padding:13px 24px;
    font-size:14px;font-weight:600;border-radius:24px;border:1px solid var(--rose);cursor:pointer;
  }
  .btn:hover{background:#9c4560;}
  .btn.outline{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn.outline:hover{border-color:var(--rose);color:var(--rose);}
  .btn.small{padding:9px 16px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- FILTER ---------- */
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 30px;padding-top:34px;border-top:1px solid var(--line);}
  .filter-chip{font-size:13px;padding:7px 16px;border:1px solid var(--line);border-radius:20px;cursor:pointer;background:#fff;}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-chip:hover:not(.active){border-color:var(--rose);color:var(--rose);}

  /* ---------- PRODUCT GRID ---------- */
  .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;}
  .p-card{background:#fff;border-radius:8px;overflow:hidden;transition:transform .15s ease;box-shadow:0 2px 10px rgba(46,33,31,.06);}
  .p-card:hover{transform:translateY(-3px);}
  .p-thumb{aspect-ratio:1/1;overflow:hidden;background:var(--blush-dim);cursor:pointer;}
  .p-thumb img{width:100%;height:100%;object-fit:cover;}
  .p-body{padding:16px;}
  .p-cat{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);font-weight:700;}
  .p-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.25;cursor:pointer;}
  .p-price{font-weight:700;color:var(--ink);margin-bottom:12px;font-size:15px;}
  .qty-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .qty-stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .qty-stepper button{background:#fff;border:none;width:28px;height:28px;font-size:16px;cursor:pointer;color:var(--ink);}
  .qty-stepper button:hover{background:var(--blush-dim);}
  .qty-stepper span{width:26px;text-align:center;font-size:13px;font-weight:600;}
  .p-card .btn{width:100%;justify-content:center;padding:10px;font-size:13px;border-radius:6px;}

  /* ---------- PRODUCT DETAIL ---------- */
  .detail{max-width:920px;margin:0 auto;}
  .back-link{display:inline-block;font-size:13px;color:var(--stone);margin-bottom:26px;cursor:pointer;border-bottom:1px solid transparent;}
  .back-link:hover{color:var(--rose);border-bottom-color:var(--rose);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;}
  .detail-img{border-radius:10px;overflow:hidden;background:var(--blush-dim);cursor:zoom-in;position:relative;}
  .detail-img::after{
    content:"🔍 Click to zoom";position:absolute;bottom:10px;right:10px;
    background:rgba(46,33,31,.7);color:#fff;font-size:11px;padding:4px 10px;border-radius:12px;
  }
  .detail h1{font-family:'Playfair Display',serif;font-weight:600;font-size:32px;margin:0 0 8px;}
  .detail-price{font-size:22px;font-weight:700;margin:0 0 18px;}
  .detail-note{font-size:13px;color:var(--rose);margin:0 0 18px;font-weight:600;}
  .detail-desc{font-size:15px;line-height:1.65;color:#4a3a37;margin:0 0 22px;}
  .wa-ask{font-size:13px;color:var(--stone);margin-top:14px;display:inline-block;border-bottom:1px solid var(--line);}
  .wa-ask:hover{color:var(--rose);border-color:var(--rose);}
  .related-heading{font-family:'Playfair Display',serif;font-style:italic;font-size:19px;margin:54px 0 18px;}

  /* ---------- CART ---------- */
  .cart-page{max-width:760px;margin:0 auto;}
  .cart-page h1{font-family:'Playfair Display',serif;font-size:30px;margin:0 0 26px;}
  .cart-row{display:flex;align-items:center;gap:16px;background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(46,33,31,.05);}
  .cart-thumb{width:64px;height:64px;border-radius:6px;overflow:hidden;flex:0 0 64px;background:var(--blush-dim);}
  .cart-thumb img{width:100%;height:100%;object-fit:cover;}
  .cart-info{flex:1;min-width:0;}
  .cart-name{font-family:'Playfair Display',serif;font-weight:600;font-size:15px;margin-bottom:3px;}
  .cart-unit{font-size:12.5px;color:var(--stone);}
  .cart-line-total{font-weight:700;font-size:14.5px;min-width:80px;text-align:right;}
  .remove-btn{background:none;border:none;color:var(--stone);font-size:18px;cursor:pointer;padding:4px 6px;}
  .remove-btn:hover{color:var(--rose);}
  .cart-summary{background:#fff;border-radius:8px;padding:22px;margin-top:20px;box-shadow:0 2px 8px rgba(46,33,31,.05);}
  .cart-total-row{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:18px;}
  .empty-cart{text-align:center;padding:60px 20px;color:var(--stone);}
  .empty-cart .btn{margin-top:18px;}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;bottom:90px;right:22px;background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:200;
    opacity:0;transform:translateY(10px);transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(20,14,13,.9);display:none;align-items:center;justify-content:center;z-index:300;padding:30px;cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:90vw;max-height:85vh;border-radius:6px;object-fit:contain;}
  .lightbox-close{position:absolute;top:22px;right:26px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none;}

  /* ---------- STATIC / ABOUT / POLICY ---------- */
  .static-page{max-width:640px;margin:0 auto;}
  .static-page h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;margin:0 0 20px;text-align:center;}
  .static-page p{font-size:15.5px;line-height:1.65;color:#4a3a37;margin:0 0 18px;}
  .policy-list{list-style:none;padding:0;margin:26px 0 0;}
  .policy-item{
    background:#fff;border-radius:8px;padding:18px 20px;margin-bottom:12px;
    display:flex;gap:14px;align-items:flex-start;box-shadow:0 2px 8px rgba(46,33,31,.05);
  }
  .policy-icon{font-size:20px;line-height:1;}
  .policy-item strong{display:block;margin-bottom:3px;font-size:14.5px;}
  .policy-item span{font-size:13.5px;color:var(--stone);line-height:1.5;}
  .contact-card{background:#fff;border-radius:10px;padding:34px;margin-top:26px;text-align:center;box-shadow:0 2px 10px rgba(46,33,31,.06);}

  /* ---------- FAQ ACCORDION ---------- */
  .faq-item{background:#fff;border-radius:8px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(46,33,31,.05);}
  .faq-q{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:14.5px;}
  .faq-q .chev{transition:transform .2s ease;color:var(--rose);}
  .faq-item.open .faq-q .chev{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:13.5px;color:var(--stone);line-height:1.6;}
  .faq-item.open .faq-a{max-height:200px;}
  .faq-a-inner{padding:0 18px 16px;}

  /* ---------- TESTIMONIALS ---------- */
  .testimonials{margin-top:60px;padding-top:40px;border-top:1px solid var(--line);}
  .testimonial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .testimonial-card{background:#fff;border-radius:8px;padding:22px;box-shadow:0 2px 8px rgba(46,33,31,.05);}
  .testimonial-card p{font-size:14px;line-height:1.55;color:#4a3a37;margin:0 0 14px;font-style:italic;}
  .testimonial-name{font-size:13px;font-weight:700;color:var(--rose);}
  .sample-note{font-size:11.5px;color:var(--stone);text-align:center;margin-top:16px;}

  /* ---------- FLOATING WHATSAPP ---------- */
  .wa-float{
    position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;
    background:#25D366;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:100;cursor:pointer;
  }
  .wa-float svg{width:28px;height:28px;}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line);margin-top:20px;}
  .footer-inner{max-width:1180px;margin:0 auto;padding:34px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
  .footer-inner .wordmark{font-size:19px;}
  .footer-links{display:flex;gap:22px;font-size:13px;font-weight:600;}
  .footer-links a:hover{color:var(--rose);}
  .fine-print{max-width:1180px;margin:0 auto;padding:0 24px 28px;font-size:12px;color:var(--stone);text-align:center;}

  @media (max-width:860px){
    .hero{grid-template-columns:1fr;}
    .product-grid{grid-template-columns:repeat(2,1fr);}
    .detail-grid{grid-template-columns:1fr;}
    .testimonial-grid{grid-template-columns:1fr;}
  }
  @media (max-width:700px){
    .hamburger{display:block;}
    .navlinks{display:none;flex-direction:column;gap:14px;width:100%;padding-top:6px;}
    .navlinks.open{display:flex;}
    .nav-row{flex-direction:column;align-items:stretch;}
    .cart-btn{position:static;transform:none;align-self:center;margin-top:12px;order:2;}
  }
  @media (max-width:480px){ .product-grid{grid-template-columns:1fr;} }
  :focus-visible{outline:2px solid var(--rose);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ .badge{animation:none;opacity:1;} }
</style>
</head>
<body>

<nav>
  <span class="badge">001 of Jewelries in Benin ✨</span>
  <div class="wordmark">Ora by Divi</div>
  <div class="tagline">Soft Girl Jewelry · Affordable Luxury · Benin City</div>
  <div class="nav-row">
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    <div class="navlinks" id="navlinks">
      <span class="navlink" data-view="home">Home</span>
      <span class="navlink" data-view="shop">Shop All</span>
      <span class="navlink" data-view="how">How It Works</span>
      <span class="navlink" data-view="contact">Contact</span>
    </div>
    <button class="cart-btn" id="cartBtn">🛍️ Cart <span class="cart-count" id="cartCount">0</span></button>
  </div>
</nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="Zoomed product photo">
</div>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.4 1.26 4.83L2 22l5.4-1.42a9.9 9.9 0 0 0 4.64 1.18h.01c5.46 0 9.9-4.45 9.9-9.91S17.5 2 12.04 2zm0 18.06h-.01c-1.46 0-2.9-.39-4.15-1.13l-.3-.18-3.08.81.82-3-.19-.31a8.02 8.02 0 0 1-1.24-4.34c0-4.44 3.62-8.06 8.06-8.06 2.15 0 4.17.84 5.7 2.36a8 8 0 0 1 2.36 5.7c0 4.44-3.62 8.06-8.07 8.06zm4.42-6.04c-.24-.12-1.43-.7-1.65-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.78.95-.14.16-.29.18-.53.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.11-.49.11-.11.24-.29.36-.43.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.42-.55-.42-.14-.01-.3-.01-.46-.01s-.42.06-.64.3c-.22.24-.85.83-.85 2.02 0 1.19.87 2.34 1 2.5.12.16 1.7 2.6 4.13 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.43-.58 1.63-1.15.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
</a>

<footer>
  <div class="footer-inner">
    <div class="wordmark serif">Ora by Divi</div>
    <div class="footer-links">
      <a class="navlink" data-view="shop">Shop</a>
      <a class="navlink" data-view="how">How It Works</a>
      <a class="navlink" data-view="contact">Contact</a>
    </div>
  </div>
  <div class="fine-print">© 2026 Ora by Divi. Handpicked jewelry, Benin City — delivered every Saturday.</div>
</footer>

<script>
const WA_NUMBER = "2349132378041";

let PRODUCTS = []; // loaded from products.json at startup — see loadProducts() below

const TESTIMONIALS = [
  { quote:"Sample review — replace with a real one from a happy customer.", name:"Customer Name" },
  { quote:"Sample review — mention what they loved (quality, speed, packaging).", name:"Customer Name" },
  { quote:"Sample review — keep it short and specific, that reads most genuine.", name:"Customer Name" },
];

const FAQS = [
  { q:"Do you deliver outside Benin City?", a:"Message us on WhatsApp with your location and we'll let you know the rider fee and timing." },
  { q:"Can I pay in installments?", a:"Yes — let us know when you order, and your item is delivered once payment is complete." },
  { q:"What if I'm not happy with my order?", a:"Please confirm the item, price, and photos with us before paying, as all sales are final once payment is made." },
];

const state = { view:"home", cat:"all" };
const cart = {}; // { productId: qty }
const main = document.getElementById("main");

function money(n){ return "₦" + n.toLocaleString("en-NG"); }

function waLink(product){
  const msg = product
    ? `Hi! I'm interested in the ${product.name} (${product.priceLabel}). Is it available?`
    : "Hi! I'd like to know more about your jewelry.";
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function checkoutLink(){
  const lines = Object.keys(cart).map(id=>{
    const p = PRODUCTS.find(x=>x.id===parseInt(id));
    const qty = cart[id];
    return `${qty}x ${p.name} (${money(p.price)} each) = ${money(p.price*qty)}`;
  });
  const total = cartTotal();
  const msg = `Hi! I'd like to order:\n\n${lines.join("\n")}\n\nTotal: ${money(total)}\n\nPlease confirm availability.`;
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  return Object.keys(cart).reduce((sum,id)=>{
    const p = PRODUCTS.find(x=>x.id===parseInt(id));
    return sum + p.price*cart[id];
  },0);
}
function updateCartBadge(){ document.getElementById("cartCount").textContent = cartCount(); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

function addToCart(id, qty){
  cart[id] = (cart[id]||0) + qty;
  updateCartBadge();
  const p = PRODUCTS.find(x=>x.id===id);
  showToast(`Added ${p.name} to cart`);
}

function categoryList(){ return ["all","Necklaces","Bracelets","Watches","Waist Chains","Sets"]; }
function filteredProducts(){ return state.cat === "all" ? PRODUCTS : PRODUCTS.filter(p=>p.cat===state.cat); }

function productCardHTML(p){
  return `
    <div class="p-card">
      <div class="p-thumb" data-open="${p.id}"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
      <div class="p-body">
        <div class="p-cat">${p.cat}</div>
        <div class="p-name" data-open="${p.id}">${p.name}</div>
        <div class="p-price">${p.priceLabel}</div>
        <div class="qty-row">
          <div class="qty-stepper" data-qty-for="${p.id}">
            <button data-step="-1" data-target="${p.id}">−</button>
            <span id="qty-${p.id}">1</span>
            <button data-step="1" data-target="${p.id}">+</button>
          </div>
        </div>
        <span class="btn" data-add="${p.id}">Add to Cart</span>
      </div>
    </div>`;
}

function bindQtyAndAdd(container){
  container.querySelectorAll("[data-step]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute("data-target");
      const span = document.getElementById("qty-"+id);
      let val = parseInt(span.textContent) + parseInt(btn.getAttribute("data-step"));
      if(val < 1) val = 1;
      span.textContent = val;
    });
  });
  container.querySelectorAll("[data-add]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const id = parseInt(btn.getAttribute("data-add"));
      const span = document.getElementById("qty-"+id);
      const qty = span ? parseInt(span.textContent) : 1;
      addToCart(id, qty);
    });
  });
  container.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.view="detail"; state.productId=parseInt(el.getAttribute("data-open")); render();
    });
  });
}

function renderTestimonials(){
  return `
    <div class="testimonials">
      <div class="related-heading">What customers say</div>
      <div class="testimonial-grid">
        ${TESTIMONIALS.map(t=>`
          <div class="testimonial-card">
            <p>"${t.quote}"</p>
            <div class="testimonial-name">— ${t.name}</div>
          </div>`).join("")}
      </div>
      <div class="sample-note">Sample reviews — swap these for real customer feedback anytime.</div>
    </div>`;
}

function renderHome(){
  const feature = PRODUCTS[6];
  main.innerHTML = `
    <div class="hero">
      <div class="hero-img"><img src="${feature.img}" alt="${feature.name}"></div>
      <div>
        <span class="hero-eyebrow">Owambe Ready</span>
        <h1>${feature.name}</h1>
        <p>${feature.desc}</p>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
          <span class="btn" data-open="${feature.id}">View Piece</span>
          <a class="btn outline" href="${waLink(feature)}" target="_blank" rel="noopener">Ask on WhatsApp</a>
        </div>
      </div>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div class="product-grid" id="productGrid"></div>
    ${renderTestimonials()}
  `;
  renderFilters();
  renderGrid();
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.view="detail"; state.productId=parseInt(el.getAttribute("data-open")); render(); });
  });
}

function renderShop(){
  main.innerHTML = `<div class="filter-row" id="filterRow"></div><div class="product-grid" id="productGrid"></div>`;
  renderFilters();
  renderGrid();
}

function renderFilters(){
  const row = document.getElementById("filterRow");
  row.innerHTML = categoryList().map(c=>
    `<span class="filter-chip ${state.cat===c?'active':''}" data-cat="${c}">${c==="all"?"All Pieces":c}</span>`
  ).join("");
  row.querySelectorAll(".filter-chip").forEach(el=>{
    el.addEventListener("click", ()=>{ state.cat = el.getAttribute("data-cat"); state.view="shop"; render(); });
  });
}

function renderGrid(){
  const grid = document.getElementById("productGrid");
  grid.innerHTML = filteredProducts().map(productCardHTML).join("");
  bindQtyAndAdd(grid);
}

function renderDetail(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p){ renderHome(); return; }
  const related = PRODUCTS.filter(x=>x.cat===p.cat && x.id!==p.id).slice(0,3);
  main.innerHTML = `
    <div class="detail">
      <span class="back-link" id="backBtn">← Back to shop</span>
      <div class="detail-grid">
        <div class="detail-img" id="zoomImg" data-img="${p.img}"><img src="${p.img}" alt="${p.name}"></div>
        <div>
          <div class="p-cat">${p.cat}</div>
          <h1>${p.name}</h1>
          <div class="detail-price">${p.priceLabel}</div>
          ${p.note ? `<div class="detail-note">${p.note}</div>` : ""}
          <p class="detail-desc">${p.desc}</p>
          <div class="qty-row">
            <div class="qty-stepper">
              <button data-step="-1" data-target="${p.id}">−</button>
              <span id="qty-${p.id}">1</span>
              <button data-step="1" data-target="${p.id}">+</button>
            </div>
          </div>
          <span class="btn" data-add="${p.id}">Add to Cart</span>
          <br>
          <a class="wa-ask" href="${waLink(p)}" target="_blank" rel="noopener">Or ask about this item on WhatsApp →</a>
        </div>
      </div>
      ${related.length ? `
        <div class="related-heading">More in ${p.cat}</div>
        <div class="product-grid">${related.map(productCardHTML).join("")}</div>
      ` : ""}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.view="shop"; render(); });
  bindQtyAndAdd(main);
  document.getElementById("zoomImg").addEventListener("click", ()=>openLightbox(p.img));
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderCart(){
  const ids = Object.keys(cart);
  if(ids.length === 0){
    main.innerHTML = `
      <div class="cart-page">
        <h1>Your Cart</h1>
        <div class="empty-cart">
          <div style="font-size:40px;">🛍️</div>
          <p>Your cart is empty.</p>
          <span class="btn" data-view="shop">Browse Fragrances</span>
        </div>
      </div>`;
    main.querySelector("[data-view]").addEventListener("click", ()=>{ state.view="shop"; render(); });
    return;
  }
  const rows = ids.map(id=>{
    const p = PRODUCTS.find(x=>x.id===parseInt(id));
    const qty = cart[id];
    return `
      <div class="cart-row">
        <div class="cart-thumb"><img src="${p.img}" alt="${p.name}"></div>
        <div class="cart-info">
          <div class="cart-name">${p.name}</div>
          <div class="cart-unit">${p.priceLabel} each</div>
          <div class="qty-stepper" style="margin-top:8px;">
            <button data-cstep="-1" data-ctarget="${id}">−</button>
            <span id="cqty-${id}">${qty}</span>
            <button data-cstep="1" data-ctarget="${id}">+</button>
          </div>
        </div>
        <div class="cart-line-total">${money(p.price*qty)}</div>
        <button class="remove-btn" data-remove="${id}">&times;</button>
      </div>`;
  }).join("");
  main.innerHTML = `
    <div class="cart-page">
      <h1>Your Cart</h1>
      ${rows}
      <div class="cart-summary">
        <div class="cart-total-row"><span>Total</span><span id="cartTotalVal">${money(cartTotal())}</span></div>
        <a class="btn" style="width:100%;justify-content:center;" href="${checkoutLink()}" target="_blank" rel="noopener" id="checkoutBtn">Checkout via WhatsApp</a>
      </div>
    </div>`;
  main.querySelectorAll("[data-cstep]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-ctarget");
      let val = cart[id] + parseInt(btn.getAttribute("data-cstep"));
      if(val < 1) val = 1;
      cart[id] = val;
      renderCart(); updateCartBadge();
    });
  });
  main.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      delete cart[btn.getAttribute("data-remove")];
      renderCart(); updateCartBadge();
    });
  });
}

function renderHow(){
  main.innerHTML = `
    <div class="static-page">
      <h1>How It Works</h1>
      <p style="text-align:center;">Ordering from Ora by Divi is simple — here's exactly what to expect from message to delivery.</p>
      <ul class="policy-list">
        <li class="policy-item">
          <span class="policy-icon">💬</span>
          <div><strong>1. Add to cart & checkout</strong><span>Pick your pieces and quantities, then tap "Checkout via WhatsApp" — it builds your full order into one message for us.</span></div>
        </li>
        <li class="policy-item">
          <span class="policy-icon">💳</span>
          <div><strong>2. Confirm price & pay</strong><span>Most prices are fixed as listed. Can't pay the full amount at once? Installments are welcome — your item is delivered once payment is complete.</span></div>
        </li>
        <li class="policy-item">
          <span class="policy-icon">🚚</span>
          <div><strong>3. Delivery is every Saturday</strong><span>Orders placed during the week go out on the coming Saturday. Pickup is available at Ekosodin Back Gate, or we can deliver to your location for a small rider fee.</span></div>
        </li>
        <li class="policy-item">
          <span class="policy-icon">✅</span>
          <div><strong>Please confirm before paying</strong><span>All sales are final once payment is made, so do confirm the item, price, and availability with us first.</span></div>
        </li>
      </ul>
      <div class="related-heading">Frequently Asked</div>
      <div id="faqList"></div>
    </div>
  `;
  const faqList = document.getElementById("faqList");
  faqList.innerHTML = FAQS.map((f,i)=>`
    <div class="faq-item" data-faq="${i}">
      <div class="faq-q">${f.q}<span class="chev">+</span></div>
      <div class="faq-a"><div class="faq-a-inner">${f.a}</div></div>
    </div>`).join("");
  faqList.querySelectorAll(".faq-item").forEach(item=>{
    item.querySelector(".faq-q").addEventListener("click", ()=>{
      item.classList.toggle("open");
    });
  });
}

function renderContact(){
  main.innerHTML = `
    <div class="static-page">
      <h1>Get in Touch</h1>
      <p style="text-align:center;">Have a question about a piece, delivery, or a custom request? Reach out on WhatsApp — that's where we're fastest.</p>
      <div class="contact-card">
        <p style="margin-bottom:22px;">Serving Benin City · Delivery every Saturday</p>
        <a class="btn" href="${waLink()}" target="_blank" rel="noopener">Message us on WhatsApp</a>
      </div>
    </div>
  `;
}

function openLightbox(src){
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("show");
}
function closeLightbox(){ document.getElementById("lightbox").classList.remove("show"); }

function updateNavActive(){
  document.querySelectorAll(".navlink").forEach(el=>{
    const v = el.getAttribute("data-view");
    el.classList.toggle("active", v === state.view || (v==="shop" && state.view==="detail"));
  });
}

function render(){
  if(state.view==="shop"){ renderShop(); }
  else if(state.view==="how"){ renderHow(); }
  else if(state.view==="contact"){ renderContact(); }
  else if(state.view==="detail"){ renderDetail(state.productId); }
  else if(state.view==="cart"){ renderCart(); }
  else { renderHome(); }
  updateNavActive();
  document.getElementById("navlinks").classList.remove("open");
}

document.querySelectorAll(".navlink").forEach(el=>{
  el.addEventListener("click", ()=>{
    const v = el.getAttribute("data-view");
    state.view = v;
    if(v==="shop"){ state.cat="all"; }
    window.scrollTo({top:0, behavior:"smooth"});
    render();
  });
});

document.getElementById("cartBtn").addEventListener("click", ()=>{ state.view="cart"; window.scrollTo({top:0,behavior:"smooth"}); render(); });
document.getElementById("hamburger").addEventListener("click", ()=>{ document.getElementById("navlinks").classList.toggle("open"); });
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e)=>{ if(e.target.id==="lightbox") closeLightbox(); });

document.getElementById("waFloat").href = waLink();

function loadProducts(){
  main.innerHTML = `<p style="text-align:center;padding:60px 0;color:var(--stone);">Loading products…</p>`;
  fetch("products.json")
    .then(res => res.json())
    .then(data => {
      PRODUCTS = data.products.map((p, i) => ({ id: i + 1, ...p }));
      render();
    })
    .catch(err => {
      console.error("Could not load products.json", err);
      main.innerHTML = `<p style="text-align:center;padding:60px 0;color:var(--stone);">Could not load products right now. Please refresh the page.</p>`;
    });
}
loadProducts();
</script>
</body>
</html>
