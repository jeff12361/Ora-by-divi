backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "products"
    label: "Products"
    files:
      - file: "products.json"
        label: "Product Catalog"
        name: "catalog"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.priceLabel}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "cat"
                widget: "select"
                options: ["Necklaces", "Bracelets", "Watches", "Waist Chains", "Sets"]
              - { label: "Price (number, for cart math)", name: "price", widget: "number", value_type: "int" }
              - { label: "Price Label (shown on site)", name: "priceLabel", widget: "string", hint: "e.g. ₦3,000 or DM to inquire" }
              - { label: "Note (optional)", name: "note", widget: "string", required: false }
              - { label: "Photo", name: "img", widget: "image" }
              - { label: "Description", name: "desc", widget: "text" }
